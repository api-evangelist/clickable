name: Clickable
description: Clickable is a marketing analytics and digital advertising platform founded in 2006 that
  serves as an ads and analytics partner for businesses and agencies. The company builds award-winning
  pay-per-click (PPC) advertising tools for search and social campaigns and delivers customized reporting
  that cuts through data overload so marketers can focus on the metrics that matter. Clickable also offers
  VIN retention reporting purpose-built for automotive dealerships to improve customer retention. Backed
  by Union Square Ventures, the company focuses on relationship-driven managed advertising and analytics
  services rather than a public developer API.
